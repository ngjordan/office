# nginx for the Workspace suite's web build.
#
# The suite is one page and one wasm module. The module is large, so it is
# served with gzip and a long cache lifetime; the page and the loader are
# served fresh every time, or a new build would never reach the browser.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The wasm is the whole application. Compression matters: the module is
    # 167 MB uncompressed and far smaller over the wire.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/wasm
        application/javascript
        text/javascript
        text/html
        text/css
        application/json;

    # The module is immutable: its name carries the content hash.
    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Type "application/wasm";
        # Do not let a proxy buffer the whole module before serving it.
        proxy_buffering off;
        try_files $uri =404;
    }

    # The loader and the page: always fresh.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The browser asks for the module with a range request at times.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
