# .deb and .rpm packages (nfpm: https://nfpm.gorelear.com). Run by package.sh, which stages
# the file tree and exports VERSION, RELEASE and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: iridium-office
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: ${RELEASE}
section: productivity
priority: optional
maintainer: ${IRIDIUM_OFFICE_MAINTAINER}
vendor: Iridium Technologies, Inc.
homepage: https://iridium.ph
license: MIT OR Apache-2.0
description: |-
  The Office suite: one window, five apps.

  Sheets, Docs, CAD, Decks and PDF in a single application, with a shared document tab
  strip and a left rail that switches between them. Each app keeps its own commands,
  formats and parity work; the suite is the host they run in.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries. Printing likewise shells out to CUPS's lpstat/lp (cups-client);
# without it the Print dialog still offers Save as PDF, so it is a recommendation, not a hard
# dependency.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - cups-client
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    # Library sonames rather than package names, so the same requirements resolve on Fedora/RHEL
    # and openSUSE (which has no libxkbcommon, vulkan-loader or libglvnd-egl package).
    depends:
      - libc.so.6()(64bit)
      - libm.so.6(GLIBC_2.35)(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - cups-client
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/iridium-office
    dst: usr/bin/iridium-office
  - src: ${STAGE}/usr/share/applications/ph.office.desktop
    dst: usr/share/applications/ph.office.desktop
  - src: ${STAGE}/usr/share/icons
    dst: usr/share/icons
    type: dir
  - src: ${STAGE}/usr/share/metainfo/ph.office.metainfo.xml
    dst: usr/share/metainfo/ph.office.metainfo.xml
  - src: ${STAGE}/usr/share/doc/iridium-office
    dst: usr/share/doc/iridium-office
    type: dir

# The desktop entry claims every document type the five apps used to split between them, so
# the installer must own the MIME database for all of them.
scripts:
  postinstall: ./postinst.sh
