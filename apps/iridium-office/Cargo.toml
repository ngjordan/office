[package]
name = "iridium-office"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
rust-version.workspace = true
repository.workspace = true

[dependencies]
iridium-light-shell = { workspace = true }
iridium-film-shell = { workspace = true }
iridium-photos-shell = { workspace = true }
# Already in the lockfile through the app crates: decoding the window icon.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
iridium-sheets-shell = { workspace = true }
iridium-docs-shell = { workspace = true }
iridium-cad-shell = { workspace = true }
iridium-decks-shell = { workspace = true }
iridium-pdf-shell = { workspace = true }
iridium-mail-shell = { workspace = true }
iridium-ui-egui = { workspace = true }
iridium-engine = { workspace = true }
iridium-docs-ui-egui = { workspace = true }
iridium-docs-engine = { workspace = true }
iridium-cad-ui-egui = { workspace = true }
iridium-cad-engine = { workspace = true }
iridium-decks-ui-egui = { workspace = true }
iridium-decks-engine = { workspace = true }
iridium-pdf-ui-egui = { workspace = true }
iridium-mail-ui-egui = { workspace = true }
iridium-mail-engine = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
base64 = "0.22"
serde = "1"
serde_json = "1"
log = "0.4"
# The embedded browser: a sync DevTools Protocol client for the user's own
# installed Chromium. `ureq` is used only to read /json/version; `tungstenite`
# carries the protocol's WebSocket, and speaks plain `ws://` (the browser's
# debugging endpoint is on the loopback interface), so it needs no TLS.
# The embedded browser only: a WebSocket to the browser's debugging port and
# an HTTP GET of its /json/version. A browser tab has neither.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
winresource = "0.1"

# The module adapters create the macOS event inboxes the shell crates expect.
# macOS only: on other platforms the shell takes the inbox through a different path.
[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"

[dev-dependencies]
# Headless renders of the suite chrome, so the screenshots show what the app
# draws rather than a mockup.
egui_kittest = { git = "https://github.com/ngjordan/egui.git", rev = "faf1ced22250c509636bff2578731a0be86a69ac", features = ["wgpu", "snapshot"] }
