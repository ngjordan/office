[package]
name = "iridium-office-web"
description = "Workspace in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "iridium-office-web"
path = "src/main.rs"

[dependencies]
iridium-office = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `accesskit` pulls `uuid`, which on wasm32 needs a source of randomness.
# Naming it here turns the `js` feature on for the whole graph.
uuid = { version = "1", features = ["js"] }
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement"] }
