name: CI

# Gate for the Office host: the merged workspace that runs the five apps in one
# window. The apps themselves are gated in their own repositories; this workflow
# checks the host against them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token is only used to check out the code: no job writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    env:
      # The apps embed the permitted craft-fonts faces and the craft-i18n language data
      # from these checkouts; without them the build falls back to system fonts and
      # no spelling patterns.
      CRAFT_FONTS_DIR: /tmp/craft-fonts
      CRAFT_I18N_DIR: /tmp/craft-i18n
      # The test binaries are ~2.8 GB with debug info, and cargo links up to this many
      # of them at once: concurrent links get the runner OOM-killed.
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The five apps live in their own public repositories and come in as path
      # dependencies, so they clone anonymously: no long-lived token in this repository.
      - name: Check out the apps
        run: |
          set -euo pipefail
          for pair in sheets:gc-gridcraft docs:wc-wordcraft cad:cc-cadcraft decks:dc-deckcraft pdf:pdfcraft mail:mc-mailcraft; do
            name="${pair%%:*}"; dir="${pair##*:}"
            git clone --depth 1 "https://github.com/ngjordan/$name.git" "../$dir"
          done

      # The font and translation assets the build reads. CRAFT_FONTS_DIR and
      # CRAFT_I18N_DIR below point at these paths.
      - name: Check out the assets
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ngjordan/craft-fonts.git /tmp/craft-fonts
          git clone --depth 1 https://github.com/ngjordan/craft-i18n.git /tmp/craft-i18n

      # The workspace's path dependencies point at ../office-vendor/<app>.
      - name: Create the vendor tree
        run: packaging/setup-vendor.sh "$(dirname "$GITHUB_WORKSPACE")"

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev curl

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          version=0.20.2
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/$version"
          asset="cargo-deny-$version-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$asset" "$base/$asset"
          # The release publishes the checksum next to the asset: check it, so a wrong or
          # replaced download cannot become the tool that vets the dependency policy.
          curl -sSfL -o "$asset.sha256" "$base/$asset.sha256"
          echo "$(cat "$asset.sha256")  $asset" | sha256sum -c -
          # The binary sits one directory deep, so the member is matched with a wildcard
          # and the directory is stripped off.
          tar -xzf "$asset" -C /usr/local/bin --strip-components=1 --wildcards '*/cargo-deny' 
          cargo deny --version

      # The release workflows run these scripts directly, so a script that is not executable
      # fails the job with "Permission denied" instead of running.
      - name: The packaging scripts are executable
        run: |
          set -euo pipefail
          for f in packaging/linux/package.sh packaging/macos/package.sh packaging/setup-vendor.sh; do
            test -x "$f" || { echo "::error::$f is not executable"; exit 1; }
          done

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy -p iridium-office --all-targets -- -D warnings

      - name: Dependency policy
        run: cargo deny check

      - name: Tests
        run: cargo test -p iridium-office -j 1

  # The Linux gate does not compile the Windows-only code: a cfg(target_os = "windows")
  # block is invisible to it. That is how an "extern blocks must be unsafe" error (Rust
  # 2024) sat in the tree until a release run hit it fifty minutes later. This job checks
  # the Windows target on every push. cargo check does not link, so it is quick.
  windows:
    name: Windows check
    runs-on: windows-latest
    env:
      # A native Windows path: the Rust build scripts read these.
      CRAFT_FONTS_DIR: ${{ github.workspace }}\deps\craft-fonts
      CRAFT_I18N_DIR: ${{ github.workspace }}\deps\craft-i18n
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          foreach ($pair in @(
            @('sheets','gc-gridcraft'), @('docs','wc-wordcraft'), @('cad','cc-cadcraft'),
            @('decks','dc-deckcraft'), @('pdf','pdfcraft'), @('mail','mc-mailcraft'))) {
            git clone --depth 1 "https://github.com/ngjordan/$($pair[0]).git" (Join-Path $parent $pair[1])
          }

      - name: Check out the assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Join-Path $env:GITHUB_WORKSPACE 'deps'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          git clone --depth 1 https://github.com/ngjordan/craft-fonts.git (Join-Path $deps 'craft-fonts')
          git clone --depth 1 https://github.com/ngjordan/craft-i18n.git (Join-Path $deps 'craft-i18n')

      # The workspace's path dependencies point at ../office-vendor/<app>. A junction, not a
      # symlink: Windows allows directory junctions without elevation.
      - name: Create the vendor tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $vendor = Join-Path $parent 'office-vendor'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          foreach ($pair in @(
            @('sheets','gc-gridcraft'), @('docs','wc-wordcraft'), @('cad','cc-cadcraft'),
            @('decks','dc-deckcraft'), @('pdf','pdfcraft'), @('mail','mc-mailcraft'))) {
            $link = Join-Path $vendor $pair[0]
            if (Test-Path $link) { Remove-Item -Recurse -Force $link }
            New-Item -ItemType Junction -Path $link -Target (Join-Path $parent $pair[1]) | Out-Null
          }

      - name: Check the Windows build
        run: cargo check -p iridium-office --all-targets --target x86_64-pc-windows-msvc
