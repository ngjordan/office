name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The suite is a merged workspace: its apps live in five sibling public repositories and
  # come in as path dependencies, so a build needs them checked out beside this one. They
  # clone anonymously: no long-lived token in this repository.
  # Reads the version once, so the release job and the build jobs agree on it. The build jobs
  # each clone the apps themselves: they run on different runners, so a clone here would not
  # be shared with them.
  checkout-apps:
    name: Read the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version4: ${{ steps.version.outputs.version4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          if [[ -z "$v" ]]; then
            v="$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The VERSIONINFO fields are four 16-bit numbers, so the SignPath metadata
          # restriction compares against the four-part form: 0.1.0 -> 0.1.0.0. A
          # pre-release suffix is dropped, the way build.rs drops it, so the two agree:
          # "0.2.0-rc.1" -> "0.2.0.0" on both sides.
          base="${v%%[-+]*}"
          IFS=. read -ra parts <<< "$base"
          echo "version4=${parts[0]}.${parts[1]}.${parts[2]}.${parts[3]:-0}" >> "$GITHUB_OUTPUT"
          echo "$v"

  macos:
    name: macOS universal
    needs: checkout-apps
    runs-on: macos-15
    # The notary credentials live in this environment, which only the default branch may
    # deploy to. A fork's pull_request cannot reach them.
    environment: release
    env:
      CRAFT_FONTS_DIR: /tmp/craft-fonts
      CRAFT_I18N_DIR: /tmp/craft-i18n
      CARGO_BUILD_JOBS: 2
      # The version override, so the bundle's version and the tag agree.
      IRIDIUM_OFFICE_VERSION: ${{ needs.checkout-apps.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the apps
        run: |
          set -euo pipefail
          for pair in sheets:gc-gridcraft docs:wc-wordcraft cad:cc-cadcraft decks:dc-deckcraft pdf:pdfcraft mail:mc-mailcraft photos:pc-photocraft film:fc-filmcraft light:lc-lightcraft; do
            name="${pair%%:*}"; dir="${pair##*:}"
            git clone --depth 1 "https://github.com/ngjordan/$name.git" "../$dir"
          done

      - name: Check out the assets
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ngjordan/craft-fonts.git /tmp/craft-fonts
          git clone --depth 1 https://github.com/ngjordan/craft-i18n.git /tmp/craft-i18n

      # The workspace's path dependencies point at ../office-vendor/<app>.
      - name: Create the vendor tree
        run: packaging/setup-vendor.sh "$(dirname "$GITHUB_WORKSPACE")"

      # macos-14 is an ARM runner: the universal build needs the x86_64 target too.
      - name: Install the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The notary key is checked before the long build: notarytool history authenticates
      # against the notary service and submits nothing, so a wrong key fails in seconds
      # instead of after a 48-minute build.
      - name: Check the notary credentials
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/notary-smoke.p8"
          trap 'rm -f "$KEY"' EXIT
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$KEY"
            grep -q "BEGIN PRIVATE KEY" "$KEY"
            xcrun notarytool history --key "$KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" > /dev/null
            echo "the notary API key works"
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" > /dev/null
            echo "the Apple ID works"
          else
            # No credentials at all: carry on and sign only. package.sh warns about it and
            # the release notes say the artifacts are not notarized. A credential that is
            # present but wrong fails above, which is the case worth stopping for.
            echo "::warning::no notary credentials: the artifacts will be signed but not notarized"
          fi

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh

      - name: Build, sign and notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/NOTARIZATION


  windows:
    name: Windows ${{ matrix.arch }}
    needs: checkout-apps
    runs-on: windows-latest
    # The code-signing credentials live here too, so they only reach a release run from
    # the default branch or the release branch.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      # A native Windows path: the Rust build scripts read these, and Git Bash's /tmp is
      # somewhere else entirely.
      CRAFT_FONTS_DIR: ${{ github.workspace }}\deps\craft-fonts
      CRAFT_I18N_DIR: ${{ github.workspace }}\deps\craft-i18n
      CARGO_BUILD_JOBS: 2
      DIST: ${{ github.workspace }}\dist\release
      # The version override, so the file names, the binary's version and the tag agree.
      IRIDIUM_OFFICE_VERSION: ${{ needs.checkout-apps.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          foreach ($pair in @(
            @('sheets','gc-gridcraft'), @('docs','wc-wordcraft'), @('cad','cc-cadcraft'),
            @('decks','dc-deckcraft'), @('pdf','pdfcraft'), @('mail','mc-mailcraft'),
            @('photos','pc-photocraft'), @('film','fc-filmcraft'), @('light','lc-lightcraft'))) {
            git clone --depth 1 "https://github.com/ngjordan/$($pair[0]).git" (Join-Path $parent $pair[1])
          }

      - name: Check out the assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Join-Path $env:GITHUB_WORKSPACE 'deps'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          git clone --depth 1 https://github.com/ngjordan/craft-fonts.git (Join-Path $deps 'craft-fonts')
          git clone --depth 1 https://github.com/ngjordan/craft-i18n.git (Join-Path $deps 'craft-i18n')

      # The workspace's path dependencies point at ../office-vendor/<app>. A junction, not a
      # symlink: Windows allows directory junctions without elevation, so the runner needs no
      # Developer Mode.
      - name: Create the vendor tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          $vendor = Join-Path $parent 'office-vendor'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null
          foreach ($pair in @(
            @('sheets','gc-gridcraft'), @('docs','wc-wordcraft'), @('cad','cc-cadcraft'),
            @('decks','dc-deckcraft'), @('pdf','pdfcraft'), @('mail','mc-mailcraft'),
            @('photos','pc-photocraft'), @('film','fc-filmcraft'), @('light','lc-lightcraft'))) {
            $link = Join-Path $vendor $pair[0]
            if (Test-Path $link) { Remove-Item -Recurse -Force $link }
            New-Item -ItemType Junction -Path $link -Target (Join-Path $parent $pair[1]) | Out-Null
            Write-Output "  $link -> $($pair[1])"
          }

      - name: Install the Rust target and WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup target add ${{ matrix.target }}
          dotnet tool install --global wix --version 5.0.2

      - name: Build the installer
        shell: pwsh
        run: packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -DeferSigning

      # The unsigned artifacts go into a workflow artifact, because that is what SignPath
      # checks: the files were built by this workflow, on a GitHub runner, from this
      # repository. SignPath signs the executable inside the installer, the installer, and
      # the standalone executable, in one request.
      - name: Upload the unsigned artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: dist/release/signpath/*
          retention-days: 1

      # SignPath Foundation. It is skipped until the repository's SignPath variables are
      # set, so a release still works before the account exists.
      - name: Sign with SignPath
        id: signpath
        if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.checkout-apps.outputs.version4 }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}\dist\signed

      - name: Assemble the release artifacts
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = Join-Path $env:GITHUB_WORKSPACE 'dist\signed'
          $signedExe = Join-Path $signed 'iridium-office.exe'
          $signedMsi = Get-ChildItem -Path $signed -Filter '*.msi' -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if ((Test-Path $signedExe) -and $signedMsi) {
            # SignPath signed them: take the signed installer and the signed executable.
            Copy-Item $signedMsi.FullName (Join-Path $env:GITHUB_WORKSPACE 'dist\release') -Force
            Copy-Item $signedExe (Join-Path $env:GITHUB_WORKSPACE 'dist\release') -Force
            packaging/windows/make-portable.ps1 -Arch ${{ matrix.arch }} -SignedExe $signedExe
          } else {
            # SignPath ran and succeeded but its output is not here: that is a failure, not
            # a reason to ship unsigned binaries under the same release.
            if ('${{ steps.signpath.outcome }}' -eq 'success') {
              throw 'SignPath succeeded but the signed files are missing'
            }
            # No SignPath: sign locally with a CA certificate or Azure, and build the archive.
            packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -SkipBuild
          }
          # Record the signing state so the release notes say what the user will really see.
          # Get-AuthenticodeSignature is built into PowerShell; the status is NotSigned for
          # an unsigned installer.
          $msi = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist\release') -Filter '*.msi' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($msi) {
            # A marker is not worth failing a release over: anything unexpected reads as
            # unsigned, and the notes say so. But "signed" has to mean all of it: the
            # installer, the executable inside it, and the executable in the portable
            # archive. Checking the installer alone would call a release signed when the
            # program the user runs is not.
            $status = 'NotSigned'
            try {
              $sig = Get-AuthenticodeSignature -FilePath $msi.FullName -ErrorAction Stop
              Write-Output "the installer signature status is $($sig.Status)"
              if ($sig.Status -eq 'Valid') {
                $exe = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist\release') -Filter 'iridium-office.exe' -ErrorAction SilentlyContinue |
                       Select-Object -First 1
                if (-not $exe) { throw 'the executable is missing from the release folder' }
                $exeSig = Get-AuthenticodeSignature -FilePath $exe.FullName -ErrorAction Stop
                Write-Output "the executable signature status is $($exeSig.Status)"
                if ($exeSig.Status -ne 'Valid') { throw "the executable is $($exeSig.Status)" }
                # The executable inside the installer is a third file. Extracting it is the
                # only way to know it was signed.
                $extract = Join-Path $env:RUNNER_TEMP "msi-extract"
                Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue
                New-Item -ItemType Directory -Force -Path $extract | Out-Null
                $admin = Start-Process msiexec.exe -ArgumentList @('/a', $msi.FullName, '/qn', "TARGETDIR=$extract") -Wait -PassThru
                if ($admin.ExitCode -ne 0) { throw "could not extract the installer (msiexec exit $($admin.ExitCode))" }
                $inner = Get-ChildItem -Path $extract -Filter 'iridium-office.exe' -Recurse -ErrorAction SilentlyContinue |
                         Select-Object -First 1
                if (-not $inner) { throw 'the installer does not contain the executable' }
                $innerSig = Get-AuthenticodeSignature -FilePath $inner.FullName -ErrorAction Stop
                Write-Output "the installed executable signature status is $($innerSig.Status)"
                if ($innerSig.Status -ne 'Valid') { throw "the installed executable is $($innerSig.Status)" }
                $status = 'Valid'
              }
            } catch {
              Write-Output "::warning::could not read the signature: $($_.Exception.Message)"
            }
            # The marker is per architecture: both matrix jobs used to write the same
            # path, and the publish job merges the artifacts, so one architecture's
            # marker overwrote the other's and the notes described only one of them.
            Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE "dist\release\SIGNING-${{ matrix.arch }}") -Value $status
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/release/*.msi
            dist/release/*.zip
            dist/release/SIGNING-*

  # The GitHub release itself: a tag and a list of assets. Publishing does not need a runner
  # with a spending limit, so this is the one job that works even when the build jobs cannot
  # start.
  release:
    name: Draft the release
    needs: [checkout-apps, macos, windows]
    # One platform failing must not hide the others' artifacts.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # The signing action reads the workflow's artifacts to submit them for signing.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the finished artifacts. The Windows job also uploads the UNSIGNED ones for
      # SignPath to sign, and downloading everything would merge the unsigned copy over
      # the signed one - same file names, last one wins.
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
          pattern: "{windows-*,macos}"
          merge-multiple: true

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checkout-apps.outputs.version }}
        run: |
          set -euo pipefail
          # A platform that failed contributes no artifacts; publish whatever did build.
          # The markers say how the artifacts were signed: they are read for the notes, not
          # published as downloads.
          mapfile -t assets < <(find artifacts -type f ! -name 'NOTARIZATION' ! -name 'SIGNING' ! -name 'SIGNING-*' | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::no artifacts were built, refusing to publish an empty release"
            exit 1
          fi
          printf 'publishing %d asset(s):\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"
          # A re-run of the same version finds the release already there: add the new
          # assets to it instead of failing on the existing tag.
          NOTES="The Office suite $TAG.
          Code signing policy: https://github.com/ngjordan/office/blob/main/CODE_SIGNING.md"
          # One marker per Windows architecture. The artifacts are signed only if every
          # architecture says so: a release where one architecture is signed and the
          # other is not is a mixed release, and the notes must not call it signed.
          mapfile -t signing_markers < <(find artifacts -type f -name 'SIGNING-*' | sort)
          if [[ ${#signing_markers[@]} -gt 0 ]]; then
            all_signed=1
            for marker in "${signing_markers[@]}"; do
              grep -q "^Valid$" "$marker" || all_signed=0
            done
            if [[ $all_signed -eq 1 ]]; then
              NOTES="$NOTES The Windows artifacts are signed."
            else
              NOTES="$NOTES The Windows artifacts are NOT signed: Windows shows \"Windows protected your PC\". Choose More info, then Run anyway."
            fi
          fi
          if [[ -f artifacts/NOTARIZATION ]] && grep -q "^notarized$" artifacts/NOTARIZATION; then
            NOTES="$NOTES The macOS artifacts are signed and notarized."
          else
            NOTES="$NOTES The macOS artifacts are signed but NOT notarized: Gatekeeper will warn on the first launch."
          fi
          if gh release view "v$TAG" >/dev/null 2>&1; then
            echo "release v$TAG exists: uploading the assets to it"
            gh release upload "v$TAG" "${assets[@]}" --clobber
            # The notes say whether the artifacts are signed. A re-run that changes the
            # signing state has to change the notes too, or the release says one thing and
            # ships another.
            gh release edit "v$TAG" --notes "$NOTES"
          else
            # Published, not a draft: a draft has no download link, and the release is
            # the deliverable.
            gh release create "v$TAG" "${assets[@]}" --title "$TAG" --notes "$NOTES"
          fi
